# SCUF and other generic DualShock clones.
#
# The kernel has no driver for these, so hid-generic exposes the HID report
# descriptor as-is: the right stick lands on ABS_Z/ABS_RZ, the analog triggers
# on ABS_RX/ABS_RY, and the face buttons are shifted by one into BTN_C/BTN_Z.
#
# Verified against SCUF Gaming SCUF Controller (2e95:7725).

[profile]
description = Generic DualShock clone on hid-generic

[match]
# The shifted face buttons are the reliable signature of this layout: a pad
# with a real driver reports neither of them.
buttons = BTN_C BTN_Z

[axes]
ABS_X = ABS_X stick
ABS_Y = ABS_Y stick
ABS_Z = ABS_RX stick
ABS_RZ = ABS_RY stick
ABS_RX = ABS_Z trigger
ABS_RY = ABS_RZ trigger
ABS_HAT0X = ABS_HAT0X hat
ABS_HAT0Y = ABS_HAT0Y hat

[buttons]
BTN_SOUTH = BTN_X
BTN_EAST = BTN_A
BTN_C = BTN_B
BTN_NORTH = BTN_Y
BTN_WEST = BTN_TL
BTN_Z = BTN_TR
BTN_SELECT = BTN_THUMBL
BTN_START = BTN_THUMBR
BTN_TL2 = BTN_SELECT
BTN_TR2 = BTN_START
BTN_MODE = BTN_MODE

# DS4-style shells report a touchpad click here. The Xbox 360 layout has no
# room for it, so it is left unmapped; map it in /etc/scuf-controller.conf if
# you want it somewhere.
# BTN_THUMBL = BTN_MODE

[digital-triggers]
# These pads send a digital "trigger down" bit alongside the analog value.
# Whichever is pressed harder wins.
BTN_TL = ABS_Z
BTN_TR = ABS_RZ
