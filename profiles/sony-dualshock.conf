# Official Sony DualShock 4 and DualSense pads driven by hid-sony or
# hid-playstation, which already report a sane layout. Only the face buttons
# and the stick/trigger axis assignment need adjusting.

[profile]
description = Official DualShock 4 / DualSense on hid-sony or hid-playstation

[match]
# A properly-driven pad reports the semantic face buttons and both stick
# clicks, and never the shifted BTN_C/BTN_Z of a raw HID clone.
buttons = BTN_THUMBL BTN_THUMBR
not_buttons = BTN_C BTN_Z

[axes]
ABS_X = ABS_X stick
ABS_Y = ABS_Y stick
ABS_RX = ABS_RX stick
ABS_RY = ABS_RY stick
ABS_Z = ABS_Z trigger
ABS_RZ = ABS_RZ trigger
ABS_HAT0X = ABS_HAT0X hat
ABS_HAT0Y = ABS_HAT0Y hat

[buttons]
BTN_SOUTH = BTN_A
BTN_EAST = BTN_B
BTN_NORTH = BTN_Y
BTN_WEST = BTN_X
BTN_TL = BTN_TL
BTN_TR = BTN_TR
BTN_SELECT = BTN_SELECT
BTN_START = BTN_START
BTN_THUMBL = BTN_THUMBL
BTN_THUMBR = BTN_THUMBR
BTN_MODE = BTN_MODE

[digital-triggers]
