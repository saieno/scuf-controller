# Configuration for the scuf-controller service.
# Restart the service after editing:  sudo systemctl restart scuf-controller
#
# This file holds local settings. Controller *layouts* live in profile files:
#   /usr/share/scuf-controller/profiles/   shipped with the package
#   /etc/scuf-controller.d/                yours; same filename shadows a shipped one
#
# To add a controller, generate a starting point rather than writing one by
# hand:  scuf-controller --dump-profile > /etc/scuf-controller.d/mypad.conf

[scuf-controller]

# Which event device to use. Leave blank to auto-detect the first gamepad.
# Run `scuf-controller --list` to see the candidates. Prefer a stable
# /dev/input/by-id/... path over /dev/input/eventN, which can change between
# boots depending on what else is plugged in.
device =

# Which profile to apply. "auto" picks the best match for the connected pad:
# a profile naming its USB id wins over one matching on name, which wins over
# one matching on capabilities alone. `scuf-controller --list-profiles` shows
# what is installed; set this to a profile name to pin it.
profile = auto

# Flip a stick's vertical axis if up and down come out backwards in games.
invert_left_y = false
invert_right_y = false


# Local overrides applied on top of whichever profile was chosen. Use these for
# a one-off tweak; if you are describing a whole controller, write a profile
# instead so it can be shared.
#
# Run `sudo scuf-controller --debug` to see the source name of each control as
# you press or move it.

# <source button> = <Xbox 360 button>, or "none" to unmap.
# Valid targets: BTN_A BTN_B BTN_X BTN_Y BTN_TL BTN_TR BTN_SELECT BTN_START
#                BTN_MODE BTN_THUMBL BTN_THUMBR
#
# Note that BTN_X is really BTN_NORTH and BTN_Y is really BTN_WEST; that is how
# the kernel's xpad driver labels them, and matching it is what makes games see
# a genuine Xbox 360 pad.
[buttons]

# DS4-style shells report a touchpad click that the Xbox 360 layout has no room
# for, so it is left unmapped. Uncomment to put it somewhere:
# BTN_THUMBL = BTN_MODE


# <source axis> = <Xbox 360 axis> <kind>, or "none" to unmap.
# Valid targets: ABS_X ABS_Y ABS_RX ABS_RY (sticks, scaled to -32768..32767)
#                ABS_Z ABS_RZ             (triggers, scaled to 0..255)
#                ABS_HAT0X ABS_HAT0Y      (dpad, -1..1)
# Kinds: stick, trigger, hat. The kind decides how the source range is scaled,
# so it must match what the target axis expects.
[axes]

# Example - swap the sticks:
# ABS_X = ABS_RX stick
# ABS_Y = ABS_RY stick
# ABS_Z = ABS_X stick
# ABS_RZ = ABS_Y stick
